<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tracer l’API — Andika (rempli)</title>
<style>
  :root{
    --bg:#f8fafc; --card:#fff; --ink:#0f172a; --muted:#475569; --border:#e2e8f0;
    --p1:#e0f2fe; --p2:#eef2ff; --p3:#dcfce7; --accent:#60a5fa; --accent2:#a78bfa; --good:#0b7669;
  }
  *{box-sizing:border-box}
  body{margin:0;font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
  header{padding:14px 12px;text-align:center}
  header h1{margin:.2rem 0 0;font-size:clamp(18px,4.2vw,26px);font-weight:800}
  header p{margin:.2rem 0;color:var(--muted);font-size:clamp(12px,2.8vw,15px)}
  .wrap{max-width:1100px;margin:0 auto;padding:0 12px 20px}
  .controls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:6px auto 12px}
  .chip{display:flex;align-items:center;gap:8px;background:linear-gradient(180deg,var(--p2),var(--p1));
        border:1px solid var(--border);border-radius:999px;padding:6px 10px}
  .chip label{font-size:12px;color:var(--muted)}
  .chip input[type="range"]{accent-color:var(--accent);width:120px}
  .chip input[type="number"]{width:56px;padding:3px 6px;border:1px solid var(--border);border-radius:8px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:8px}
  .tile{background:var(--card);border:1px solid var(--border);border-radius:12px;display:grid;place-items:center;
        aspect-ratio:1/1;cursor:pointer;box-shadow:0 1px 2px rgba(15,23,42,.06);transition:transform .06s, box-shadow .06s}
  .tile:hover{transform:translateY(-1px);box-shadow:0 6px 14px rgba(15,23,42,.06)}
  .tile.active{outline:2px solid var(--accent)}
  .tile img{width:56px;height:56px;filter:grayscale(.08)}
  /* Deux colonnes même sur mobile, tailles adaptées */
  .panel{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start;margin-top:12px}
  @media (min-width:860px){ .panel{gap:18px} .tile img{width:68px;height:68px} }
  .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:10px;box-shadow:0 1px 2px rgba(15,23,42,.06)}
  .card h3{margin:.25rem 0 .5rem;font-size:14px;color:var(--muted);font-weight:700}
  /* Stage carré: sur mobile ~44vw, sur desktop plafonné */
  .stage{position:relative;width:min(44vw, 420px);max-width:100%;margin:0 auto}
  @media (min-width:860px){ .stage{width:400px} }
  #stencilBox{position:relative;width:100%;padding-top:100%}
  #stencil{position:absolute;left:0;top:0;width:100%;height:100%;opacity:.55;image-rendering:pixelated}
  #gridOverlayStencil, #gridOverlayCanvas{
    position:absolute; left:0; top:0; width:100%; height:100%;
    pointer-events:none;
    background-image:
      linear-gradient(to right, rgba(0,0,0,0.08) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(0,0,0,0.08) 1px, transparent 1px);
    background-size:10% 10%;
  }
  canvas{width:100%;height:auto;background:#fff;border-radius:12px;border:1px solid var(--border);
         box-shadow:inset 0 0 0 1px rgba(15,23,42,.02);touch-action:none;position:relative}
  .row{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:8px;flex-wrap:wrap}
  .btn{padding:9px 12px;border:none;border-radius:12px;color:#fff;cursor:pointer;box-shadow:0 2px 6px rgba(99,102,241,.18);font-weight:600;font-size:14px}
  .btn.eval{background:linear-gradient(180deg,var(--accent),#3b82f6)}
  .btn.clear{background:linear-gradient(180deg,#a5b4fc,var(--accent2))}
  .score{font-weight:700;color:var(--good);background:linear-gradient(180deg,var(--p3),#a7f3d0);border:1px solid #99f6e4;border-radius:999px;padding:6px 10px;font-size:14px}
  .muted{color:var(--muted);font-size:12px;text-align:center;margin-top:6px}
</style>
</head>
<body>
<header class="wrap">
  <h1>Tracer l’API — Andika (pochoirs remplis)</h1>
  <p>Pochoir et canevas visibles ensemble, même sur téléphone. Règle le trait, le seuil et la tolérance.</p>
  <div class="controls">
    <div class="chip">
      <label for="lw">Épaisseur</label>
      <input id="lw" type="range" min="4" max="36" value="16">
      <input id="lw_n" type="number" min="4" max="72" value="16">
    </div>
    <div class="chip">
      <label for="th">Seuil noir</label>
      <input id="th" type="range" min="180" max="255" value="235">
      <input id="th_n" type="number" min="180" max="255" value="235">
    </div>
    <div class="chip">
      <label for="dil">Tolérance</label>
      <input id="dil" type="range" min="0" max="4" value="2">
      <input id="dil_n" type="number" min="0" max="8" value="2">
    </div>
  </div>
</header>

<main class="wrap">
  <div id="grid" class="grid"></div>

  <div class="panel">
    <div class="card">
      <h3>Pochoir</h3>
      <div id="stencilBox" class="stage">
        <img id="stencil" alt="stencil">
        <div id="gridOverlayStencil"></div>
      </div>
      <p class="muted">Pochoirs **remplis** (Andika). Ce que tu vois est ce qui est évalué.</p>
    </div>

    <div class="card">
      <h3>À toi de tracer</h3>
      <div class="stage">
        <canvas id="pad"></canvas>
        <div id="gridOverlayCanvas"></div>
      </div>
      <div class="row">
        <button id="eval" class="btn eval">Évaluer</button>
        <button id="clear" class="btn clear">Effacer</button>
        <div id="out" class="score" style="display:none"></div>
      </div>
    </div>
  </div>
</main>

<script>
/* ===== Réglages ===== */
let LINE_WIDTH = 16;
let THRESH = 235;
let DILATION_ITERS = 2;

let SIZE = 300;          // sera recalculé dynamiquement
let symbols = [];        // {ch, file}
let current = null;
let modelMask = null;

/* ===== UI sliders ===== */
const lw = document.getElementById('lw'), lw_n = document.getElementById('lw_n');
function setLW(v){ LINE_WIDTH = Math.max(1, Number(v)||16); lw.value=LINE_WIDTH; lw_n.value=LINE_WIDTH; ctx && (ctx.lineWidth = LINE_WIDTH); }
lw.oninput = e=>setLW(e.target.value); lw_n.oninput = e=>setLW(e.target.value);

const th = document.getElementById('th'), th_n = document.getElementById('th_n');
function setTH(v){ const x = Math.max(150, Math.min(255, Number(v)||235)); THRESH=x; th.value=x; th_n.value=x; if(current) svgToMask(current.file).then(m=>modelMask=m); }
th.oninput = e=>setTH(e.target.value); th_n.oninput = e=>setTH(e.target.value);

const dil = document.getElementById('dil'), dil_n = document.getElementById('dil_n');
function setDIL(v){ const x = Math.max(0, Math.min(8, Number(v)||2)); DILATION_ITERS=x; dil.value=x; dil_n.value=x; }
dil.oninput = e=>setDIL(e.target.value); dil_n.oninput = e=>setDIL(e.target.value);

/* ===== Liste des symboles ===== */
fetch('symbols.json').then(r=>r.json()).then(j=>{
  symbols = (j.symbols||[]).filter(s => (s.file||'').includes('svgs/'));
  buildGrid();
  if(symbols.length) selectSymbol(0);
}).catch(()=>{ document.getElementById('grid').textContent = "symbols.json introuvable"; });

function buildGrid(){
  const grid = document.getElementById('grid'); grid.innerHTML = '';
  symbols.forEach((s,i)=>{
    const t = document.createElement('div'); t.className='tile';
    const img = document.createElement('img'); img.src = s.file; img.alt = s.ch;
    img.onerror = ()=>{ img.style.opacity=.4; img.alt='?'; };
    t.appendChild(img); t.addEventListener('click', ()=>selectSymbol(i));
    grid.appendChild(t);
  });
}

/* ===== Placement contain ===== */
function fitRect(imgW, imgH, boxW=SIZE, boxH=SIZE){
  const rImg = imgW/Math.max(1,imgH), rBox = boxW/boxH;
  let dw, dh, dx, dy;
  if (rImg > rBox){ dw = boxW; dh = Math.round(dw/rImg); dx = 0; dy = Math.round((boxH-dh)/2); }
  else { dh = boxH; dw = Math.round(dh*rImg); dy = 0; dx = Math.round((boxW-dw)/2); }
  return {dx, dy, dw, dh};
}

/* ===== Stencil (SVG rempli) ===== */
function showStencil(url){
  const img = document.getElementById('stencil');
  img.onload = ()=>{
    const size = getStageSize(); // met à jour SIZE
    const fit = fitRect(img.naturalWidth||size, img.naturalHeight||size, size, size);
    img.style.left = fit.dx+'px'; img.style.top = fit.dy+'px';
    img.style.width = fit.dw+'px'; img.style.height = fit.dh+'px';
  };
  img.src = url;
}

/* ===== SVG -> masque ===== */
async function svgToMask(url){
  return new Promise((resolve)=>{
    const img = new Image(); img.crossOrigin='anonymous';
    img.onload = ()=>{
      const size = getStageSize();
      const fit = fitRect(img.naturalWidth||size, img.naturalHeight||size, size, size);
      const off = document.createElement('canvas'); off.width=size; off.height=size;
      const cx = off.getContext('2d');
      cx.fillStyle = '#fff'; cx.fillRect(0,0,size,size);
      cx.drawImage(img, fit.dx, fit.dy, fit.dw, fit.dh);
      const data = cx.getImageData(0,0,size,size).data;
      const mask = new Uint8Array(size*size);
      for(let i=0,p=0;i<data.length;i+=4,p++){
        const lum = data[i]*.2126 + data[i+1]*.7152 + data[i+2]*.0722;
        mask[p] = (lum < THRESH) ? 1 : 0;
      }
      resolve(mask);
    };
    img.src = url;
  });
}

/* ===== Sélection ===== */
async function selectSymbol(idx){
  document.querySelectorAll('.tile').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tile')[idx]?.classList.add('active');
  current = symbols[idx];
  showStencil(current.file);
  modelMask = await svgToMask(current.file);
  clearPad(true);
}

/* ===== Canvas HDPI (taille dynamique) ===== */
const pad = document.getElementById('pad');
const ctx  = pad.getContext('2d', {desynchronized:true});

function getStageSize(){
  const stages = Array.from(document.querySelectorAll('.stage'));
  const w = Math.max(200, Math.min(420, Math.floor(Math.min(...stages.map(s => s.getBoundingClientRect().width)) || 300)));
  SIZE = w;
  // ajuste la taille visible de la grille (elle est 100% du conteneur)
  return w;
}

function setupCanvas(){
  const size = getStageSize();
  const dpr = Math.max(1, window.devicePixelRatio||1);
  pad.width  = Math.round(size*dpr);
  pad.height = Math.round(size*dpr);
  pad.style.width  = size+'px';
  pad.style.height = size+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle = '#fff'; ctx.fillRect(0,0,size,size);
  ctx.lineCap='round'; ctx.strokeStyle='#000'; ctx.lineWidth = LINE_WIDTH;
}
setupCanvas();
window.addEventListener('resize', ()=>{
  const prevSize = SIZE;
  setupCanvas();
  // si la taille a changé, on régénère le masque du pochoir pour rester alignés
  if (current && SIZE !== prevSize){
    showStencil(current.file);
    svgToMask(current.file).then(m=>modelMask=m);
  }
});

// mobile: pas de scroll pendant le dessin
pad.style.touchAction='none';
pad.addEventListener('touchstart', e=>e.preventDefault(), {passive:false});
pad.addEventListener('touchmove',  e=>e.preventDefault(), {passive:false});

/* ===== Dessin ===== */
let drawing=false, last=null;
pad.addEventListener('pointerdown', e=>{ pad.setPointerCapture?.(e.pointerId); drawing=true; last=getXY(e); });
pad.addEventListener('pointerup',   ()=>{ drawing=false; last=null; });
pad.addEventListener('pointercancel',()=>{ drawing=false; last=null; });
pad.addEventListener('pointermove', e=>{
  if(!drawing) return;
  const {x,y} = getXY(e);
  if(last){ ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(x,y); ctx.stroke(); }
  last = {x,y};
});
function getXY(e){
  const r = pad.getBoundingClientRect();
  return { x: Math.round((e.clientX-r.left)*(SIZE/r.width)),
           y: Math.round((e.clientY-r.top) *(SIZE/r.height)) };
}

/* ===== Outils ===== */
function clearPad(init=false){
  ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,pad.width,pad.height); ctx.restore();
  setupCanvas(); if(!init) document.getElementById('out').style.display='none';
}
document.getElementById('clear').onclick = ()=>clearPad();

/* ===== Score (Dice + dilatation) ===== */
document.getElementById('eval').onclick = ()=>{
  const userMask = canvasToMask();
  const m = dilate(modelMask, SIZE, DILATION_ITERS);
  const inter = intersect(userMask, m);
  const sumU = sum(userMask), sumM = sum(modelMask);
  const denom = sumU + sumM;
  const dice = denom ? (2*inter/denom) : 0;
  const msg = dice>=.85 ? 'Très bien.' : (dice>=.65 ? 'Correct.' : 'À retravailler.');
  const out = document.getElementById('out');
  out.textContent = `Score: ${(dice*100).toFixed(1)}% — ${msg}`;
  out.style.display='inline-block';
};

function canvasToMask(){
  const size = SIZE;
  const data = ctx.getImageData(0,0,size,size).data;
  const mask = new Uint8Array(size*size);
  for(let i=0,p=0;i<data.length;i+=4,p++){
    const lum = data[i]*.2126 + data[i+1]*.7152 + data[i+2]*.0722;
    mask[p] = (lum < THRESH) ? 1 : 0;
  }
  return mask;
}
function sum(m){ let s=0; for(let i=0;i<m.length;i++) s+=m[i]; return s; }
function intersect(a,b){ let s=0; for(let i=0;i<a.length;i++) s += (a[i]&&b[i])?1:0; return s; }
function dilate(mask,size,it){
  if(it<=0) return mask.slice();
  let out = mask.slice();
  for(let k=0;k<it;k++){
    const next = out.slice();
    for(let y=1;y<size-1;y++){
      for(let x=1;x<size-1;x++){
        const i=y*size+x;
        if(out[i]){ next[i]=1; continue; }
        if(out[i-1]||out[i+1]||out[i-size]||out[i+size]) next[i]=1;
      }
    }
    out = next;
  }
  return out;
}

/* init contrôles */
const padCtx = document.getElementById('pad').getContext('2d'); // force init de ctx avant sliders
setLW(LINE_WIDTH); setTH(THRESH); setDIL(DILATION_ITERS);
</script>
</body>
</html>
