<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tracer l’API — version statique</title>
<style>
  :root { color-scheme: light dark; }
  body { margin:0; font:16px system-ui, sans-serif; background:#0b0c10; color:#eaeaea; }
  header { padding:16px 20px; text-align:center; }
  .wrap { max-width:1100px; margin:0 auto; padding:0 16px 24px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(72px,1fr)); gap:10px; }
  .tile { display:grid; place-items:center; aspect-ratio:1/1; background:#111418; border:1px solid #222; border-radius:10px; cursor:pointer; }
  .tile img { width:60px; height:60px; filter:grayscale(0.2); }
  .tile.active { outline:2px solid #2563eb; }
  .panel { display:grid; grid-template-columns:400px 420px; gap:16px; align-items:start; }
  .card { background:#111418; border:1px solid #222; border-radius:12px; padding:12px; }
  canvas { background:#fff; border-radius:8px; border:1px solid #ddd; }
  .btn { padding:10px 14px; background:#2563eb; color:#fff; border:none; border-radius:10px; cursor:pointer; }
  .row { display:flex; gap:10px; align-items:center; }
  .score { font-weight:600; }
</style>
</head>
<body>
<header>
  <h1>Tracer l’API — version statique</h1>
  <p>Choisis un symbole, trace par-dessus le pochoir, puis <em>Évaluer</em>.</p>
</header>
<main class="wrap">
  <div id="grid" class="grid"></div>
  <div class="panel" style="margin-top:18px;">
    <div class="card">
      <h3>Pochoir</h3>
      <div id="stencilBox" style="position:relative;width:400px;height:400px;">
        <img id="stencil" alt="stencil" style="position:absolute;left:0;top:0;width:400px;height:400px;opacity:.62;image-rendering:pixelated;">
      </div>
    </div>
    <div class="card">
      <h3>À toi de tracer</h3>
      <canvas id="pad" width="400" height="400"></canvas>
      <div class="row" style="margin-top:10px;">
        <button id="eval" class="btn">Évaluer</button>
        <button id="clear" class="btn" style="background:#475569;">Effacer</button>
        <div id="out" class="score"></div>
      </div>
    </div>
  </div>
</main>


  <script>
/* ====== Réglages ====== */
const SIZE = 400;              // taille CSS du canvas
const STRETCH_Y = 1.10;        // étirer verticalement le pochoir et le masque (1.00 = pas d'étirement)
const DILATION_ITERS = 2;      // tolérance du score

let symbols = [];
let current = null;
let modelMask = null;          // Uint8Array binaire
let drawScale = {dx:0, dy:0, dw:SIZE, dh:SIZE, scaleY:STRETCH_Y}; // zone où l'on dessine le stencil

/* ====== Chargement des symboles ====== */
fetch('symbols.json').then(r=>r.json()).then(j=>{
  symbols = j.symbols || [];
  buildGrid();
  if (symbols.length) selectSymbol(0);
});

/* ====== Grille ====== */
function buildGrid(){
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  symbols.forEach((s, i)=>{
    const tile = document.createElement('div');
    tile.className = 'tile';
    const img = document.createElement('img');
    img.src = s.file; img.alt = s.ch;
    tile.appendChild(img);
    tile.addEventListener('click', ()=>selectSymbol(i));
    grid.appendChild(tile);
  });
}

/* ====== Calcul du rectangle d’affichage en respectant l’aspect ====== */
function fitRect(nw, nh, boxW=SIZE, boxH=SIZE) {
  // on met l'image (nw, nh) dans le cadre (boxW, boxH) en "contain"
  const rImg = nw / nh, rBox = boxW / boxH;
  let dw, dh, dx, dy;
  if (rImg > rBox) { // image plus large que le cadre
    dw = boxW; dh = Math.round(dw / rImg);
    dx = 0; dy = Math.round((boxH - dh) / 2);
  } else {
    dh = boxH; dw = Math.round(dh * rImg);
    dx = Math.round((boxW - dw) / 2); dy = 0;
  }
  return {dx, dy, dw, dh};
}

/* ====== Convertir un SVG en masque binaire, avec respect d’aspect + étirement Y ====== */
async function svgToMask(url){
  return new Promise((resolve)=>{
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = ()=>{
      // calcul du placement
      const fit = fitRect(img.naturalWidth || SIZE, img.naturalHeight || SIZE, SIZE, SIZE);
      drawScale = {...fit, scaleY: STRETCH_Y};

      // rendu dans un canvas offscreen en respectant l’aspect et en étirant verticalement si demandé
      const off = document.createElement('canvas');
      off.width = SIZE;
      off.height = SIZE;
      const ctx = off.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0,0,SIZE,SIZE);

      // appliquer l’étirement vertical autour du centre de la zone dessinée
      ctx.save();
      const cy = fit.dy + fit.dh/2;
      ctx.translate(0, cy);
      ctx.scale(1, STRETCH_Y);
      ctx.translate(0, -cy);
      ctx.drawImage(img, fit.dx, fit.dy, fit.dw, fit.dh);
      ctx.restore();

      const data = ctx.getImageData(0,0,SIZE,SIZE).data;
      const mask = new Uint8Array(SIZE*SIZE);
      for(let i=0, p=0; i<data.length; i+=4, p++){
        const lum = data[i]*0.2126 + data[i+1]*0.7152 + data[i+2]*0.0722;
        mask[p] = (lum < 200) ? 1 : 0; // noir => 1
      }
      resolve(mask);
    };
    img.src = url;
  });
}

/* ====== Stencil visible (respect aspect + étirement visuel synchronisé) ====== */
function showStencil(url){
  const el = document.getElementById('stencil');
  el.onload = ()=>{
    const fit = fitRect(el.naturalWidth || SIZE, el.naturalHeight || SIZE, SIZE, SIZE);
    // on positionne l'image par CSS
    el.style.left = fit.dx+'px';
    el.style.top  = fit.dy+'px';
    el.style.width  = fit.dw+'px';
    el.style.height = fit.dh+'px';
    el.style.opacity = '.62';
    // étirement vertical identique au masque
    el.style.transformOrigin = '50% 50%';
    el.style.transform = `scaleY(${STRETCH_Y})`;
  };
  el.src = url;
}

/* ====== Sélection d’un symbole ====== */
async function selectSymbol(idx){
  document.querySelectorAll('.tile').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tile')[idx]?.classList.add('active');
  current = symbols[idx];
  showStencil(current.file);
  modelMask = await svgToMask(current.file);
  clearPad();
}

/* ====== Canvas HDPI + événements mobile-friendly ====== */
const pad = document.getElementById('pad');
const ctx = pad.getContext('2d', {desynchronized: true});
let drawing = false, last = null;

// mise à l’échelle HDPI
function setupCanvas(){
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  const displayW = SIZE, displayH = SIZE;
  pad.style.width = displayW + 'px';
  pad.style.height = displayH + 'px';
  pad.width  = Math.round(displayW * dpr);
  pad.height = Math.round(displayH * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); // coord. en pixels CSS
  ctx.lineWidth = 6;
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#000';
}
setupCanvas();
window.addEventListener('resize', setupCanvas);

// empêcher le scroll pendant le dessin sur mobile
pad.style.touchAction = 'none';
pad.addEventListener('touchstart', e => e.preventDefault(), {passive:false});
pad.addEventListener('touchmove',  e => e.preventDefault(), {passive:false});

// pointer events unifiés
pad.addEventListener('pointerdown', e => { pad.setPointerCapture(e.pointerId); drawing = true; last = getXY(e); });
pad.addEventListener('pointerup',   e => { drawing = false; last = null; });
pad.addEventListener('pointercancel', e => { drawing = false; last = null; });
pad.addEventListener('pointermove', e => {
  if(!drawing) return;
  const {x,y} = getXY(e);
  if(last){
    ctx.beginPath();
    ctx.moveTo(last.x, last.y);
    ctx.lineTo(x, y);
    ctx.stroke();
  }
  last = {x,y};
});

function getXY(e){
  const r = pad.getBoundingClientRect();
  return {
    x: Math.round((e.clientX - r.left) * (SIZE / r.width)),
    y: Math.round((e.clientY - r.top)  * (SIZE / r.height))
  };
}

/* ====== Outils ====== */
function clearPad(){
  ctx.clearRect(0,0,SIZE,SIZE);
  document.getElementById('out').textContent = '';
}
document.getElementById('clear').onclick = clearPad;

/* ====== Score (Dice avec légère dilation) ====== */
document.getElementById('eval').onclick = ()=>{
  const userMask = canvasToMask();
  const m = dilate(modelMask, SIZE, DILATION_ITERS);
  const inter = intersect(userMask, m);
  const sumU = sum(userMask);
  const sumM = sum(modelMask);
  const denom = sumU + sumM;
  const dice = denom ? (2*inter/denom) : 0;
  const msg = dice>=0.85 ? 'Très bien.' : (dice>=0.65 ? 'Correct.' : 'À retravailler.');
  document.getElementById('out').textContent = `Score: ${(dice*100).toFixed(1)}% — ${msg}`;
};

function canvasToMask(){
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  // On lit en pixels CSS, pas en pixels réels (transform appliquée)
  const img = ctx.getImageData(0,0,SIZE,SIZE);
  const data = img.data;
  const mask = new Uint8Array(SIZE*SIZE);
  for(let i=0, p=0;i<data.length;i+=4,p++){
    const lum = data[i]*0.2126 + data[i+1]*0.7152 + data[i+2]*0.0722;
    mask[p] = (lum < 200) ? 1 : 0;
  }
  return mask;
}
function sum(m){ let s=0; for(let i=0;i<m.length;i++) s+=m[i]; return s; }
function intersect(a,b){ let s=0; for(let i=0;i<a.length;i++) s += (a[i] && b[i]) ? 1 : 0; return s; }
function dilate(mask, size, iters){
  let out = mask.slice();
  for(let k=0;k<iters;k++){
    const next = out.slice();
    for(let y=1;y<size-1;y++){
      for(let x=1;x<size-1;x++){
        const i = y*size + x;
        if(out[i]) { next[i]=1; continue; }
        if(out[i-1]||out[i+1]||out[i-size]||out[i+size]) next[i]=1;
      }
    }
    out = next;
  }
  return out;
}
          </script>
</body>
</html>
