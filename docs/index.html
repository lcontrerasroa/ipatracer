<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IPA tracer</title>
<style>
  :root{
    --bg:#f8fafc; --card:#fff; --ink:#0f172a; --muted:#475569; --border:#e2e8f0;
    --accent:#60a5fa; --accent2:#a78bfa;
  }
  *{box-sizing:border-box}
  body{margin:0;font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
  header{padding:10px 12px;text-align:center}
  header h1{margin:0;font-size:clamp(18px,4.2vw,26px);font-weight:800}
  .wrap{max-width:1100px;margin:0 auto;padding:0 10px 14px}
  .controls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px auto}
  .chip{display:flex;align-items:center;gap:8px;background:linear-gradient(180deg,#eef2ff,#e0f2fe);
        border:1px solid var(--border);border-radius:999px;padding:6px 10px}
  .chip label{font-size:12px;color:var(--muted)}
  .chip input[type="range"]{accent-color:var(--accent);width:160px}
  .chip input[type="number"]{width:64px;padding:3px 6px;border:1px solid var(--border);border-radius:8px}
  select{padding:6px 8px;border:1px solid var(--border);border-radius:10px;background:#fff}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:6px}
  .tile{background:var(--card);border:1px solid var(--border);border-radius:12px;display:grid;place-items:center;
        aspect-ratio:1/1;cursor:pointer;box-shadow:0 1px 2px rgba(15,23,42,.06)}
  .tile.active{outline:2px solid var(--accent)}
  .tile img{width:50px;height:50px;filter:grayscale(.08)}

  .panel{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:start;margin-top:10px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:8px}
  .card h3{margin:0 0 .4rem;font-size:14px;color:var(--muted);font-weight:700;text-align:center}
  .stage{position:relative;width:clamp(140px,38vw,300px);max-width:100%;margin:0 auto}
  @media (min-width:900px){ .stage{width:340px} }

  #stencilBox{position:relative;width:100%;padding-top:100%}
  #stencil{position:absolute;left:0;top:0;width:100%;height:100%;opacity:.55;image-rendering:pixelated}
  #gridOverlayStencil, #gridOverlayCanvas{
    position:absolute; left:0; top:0; width:100%; height:100%; pointer-events:none;
    background-image:
      linear-gradient(to right, rgba(0,0,0,0.08) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(0,0,0,0.08) 1px, transparent 1px);
    background-size:12.5% 12.5%;
  }

  canvas{width:100%;height:auto;background:#fff;border-radius:12px;border:1px solid var(--border);
         box-shadow:inset 0 0 0 1px rgba(15,23,42,.02);touch-action:none;position:relative}

  .row{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:8px;flex-wrap:wrap}
  .btn{padding:9px 12px;border:none;border-radius:12px;color:#fff;cursor:pointer;box-shadow:0 2px 6px rgba(99,102,241,.18);font-weight:600;font-size:14px}
  .btn.eval{background:linear-gradient(180deg,var(--accent),#3b82f6)}
  .btn.clear{background:linear-gradient(180deg,#a5b4fc,var(--accent2))}
  .score{font-weight:700;color:#0b7669;background:linear-gradient(180deg,#dcfce7,#bbf7d0);border:1px solid #99f6e4;border-radius:999px;padding:6px 10px;font-size:14px;display:none}

  .meta{margin-top:8px;text-align:center}
  .meta .name{font-size:13px;color:#334155;margin-bottom:4px}
  .meta audio{width:100%; max-width:260px}
  .meta .license{display:block;font-size:11px;color:#64748b;margin-top:4px}
</style>
</head>
<body>
<header class="wrap">
  <h1>IPA tracer</h1>
  <div class="controls">
    <div class="chip">
      <label for="fontpick">Font</label>
      <select id="fontpick">
        <option value="mplus">M PLUS</option>
        <option value="andika">Andika</option>
        <option value="arimo">Arimo</option>
        <option value="dejavu">DejaVu Sans</option>
        <option value="cmu">CMU Sans Serif</option>
      </select>
    </div>
    <div class="chip">
      <label for="lw">Stroke</label>
      <input id="lw" type="range" min="4" max="96" value="24">
      <input id="lw_n" type="number" min="4" max="256" value="24">
    </div>
  </div>
</header>

<main class="wrap">
  <div id="grid" class="grid"></div>

  <div class="panel">
    <div class="card">
      <h3>Stencil</h3>
      <div id="stencilBox" class="stage">
        <img id="stencil" alt="stencil">
        <div id="gridOverlayStencil"></div>
      </div>
      <div class="meta">
        <div id="nameStencil" class="name"></div>
        <audio id="audioStencil" controls preload="none"></audio>
        <small id="licStencil" class="license"></small>
      </div>
    </div>

    <div class="card">
      <h3>Draw</h3>
      <div class="stage">
        <canvas id="pad"></canvas>
        <div id="gridOverlayCanvas"></div>
      </div>
      <div class="meta">
        <div id="nameCanvas" class="name"></div>
        <audio id="audioCanvas" controls preload="none"></audio>
        <small id="licCanvas" class="license"></small>
      </div>
      <div class="row">
        <button id="eval" class="btn eval">Evaluate</button>
        <button id="clear" class="btn clear">Clear</button>
        <div id="out" class="score"></div>
      </div>
    </div>
  </div>
</main>

<script>
/* cache-busting */
const BUST = 'b=' + Date.now();

/* réglages */
let LINE_WIDTH = 24;
const THRESH = 235;
const DILATION_ITERS = 3;   // plus indulgent, demandé

/* taille dynamique */
let SIZE = 280;
let MODEL_SIZE = 0;

/* état */
let symbols = [];
let available = [];
let current = null;
let modelMask = null;

/* fonte (M PLUS par défaut) */
let FONT_KEY = localStorage.getItem('ipa_font') || 'mplus';
const fontpick = document.getElementById('fontpick');
fontpick.value = FONT_KEY;
fontpick.addEventListener('change', async e=>{
  FONT_KEY = e.target.value;
  localStorage.setItem('ipa_font', FONT_KEY);
  await reloadFontSet();
});

/* Stroke UI */
const lw = document.getElementById('lw'), lw_n = document.getElementById('lw_n');
function setLW(v){ LINE_WIDTH = Math.max(1, Number(v)||24); lw.value=LINE_WIDTH; lw_n.value=LINE_WIDTH; if (ctx) ctx.lineWidth = LINE_WIDTH; }
lw.oninput = e=>setLW(e.target.value); lw_n.oninput = e=>setLW(e.target.value);

/* Métadonnées phonèmes: nom + audio + licence (Wikimedia Commons) */
const PHONO = {
  // Voyelles

         audio:"https://commons.wikimedia.org/wiki/Special:FilePath/Close_front_unrounded_vowel.ogg",
         license:"Audio © Wikimedia Commons — voir la fiche (souvent CC BY-SA 3.0/GFDL)" }, // :contentReference[oaicite:0]{index=0}
  "u": { name:"Close back rounded vowel",

         license:"Audio © Wikimedia Commons — voir la fiche" }, // :contentReference[oaicite:1]{index=1}
  "ɑ": { name:"Open back unrounded vowel",
         audio:"https://commons.wikimedia.org/wiki/Special:FilePath/Open_back_unrounded_vowel.ogg",
         license:"Audio © Wikimedia Commons — voir la fiche" }, // :contentReference[oaicite:2]{index=2}
  "æ": { name:"Near-open front unrounded vowel",
         audio:"https://commons.wikimedia.org/wiki/Special:FilePath/Near-open_front_unrounded_vowel.ogg",
         license:"Audio © Wikimedia Commons — voir la fiche" }, // :contentReference[oaicite:3]{index=3}
  "ə": { name:"Mid-central vowel (schwa)",
         audio:"https://commons.wikimedia.org/wiki/Special:FilePath/Mid-central_vowel.ogg",
         license:"Audio © Wikimedia Commons — voir la fiche" }, // :contentReference[oaicite:4]{index=4}
  "ɪ": { name:"Near-close near-front unrounded vowel",
         audio:"https://commons.wikimedia.org/wiki/Special:FilePath/Near-close_near-front_unrounded_vowel.ogg",
         license:"Audio © Wikimedia Commons — voir la fiche" }, // :contentReference[oaicite:5]{index=5}
  "ʊ": { name:"Near-close near-back rounded vowel",
         audio:"https://commons.wikimedia.org/wiki/Special:FilePath/Near-close_near-back_rounded_vowel.ogg",
         license:"Audio © Wikimedia Commons — voir la fiche" }, // :contentReference[oaicite:6]{index=6}
  "e": { name:"Close-mid front unrounded vowel",
         audio:"https://commons.wikimedia.org/wiki/Special:FilePath/Close-mid_front_unrounded_vowel.ogg",
         license:"Audio © Wikimedia Commons — voir la fiche" }, // :contentReference[oaicite:7]{index=7}
  "ɔ": { name:"Open-mid back rounded vowel",
         audio:"https://commons.wikimedia.org/wiki/Special:FilePath/Open-mid_back_rounded_vowel.ogg",
         license:"Audio © Wikimedia Commons — voir la fiche" }, // :contentReference[oaicite:8]{index=8}
  "ʌ": { name:"Open-mid back unrounded vowel",
         audio:"https://commons.wikimedia.org/wiki/Special:FilePath/Open-mid_back_unrounded_vowel.ogg",
         license:"Audio © Wikimedia Commons — voir la fiche" }, // :contentReference[oaicite:9]{index=9}

  // Occlusives
  "p": { name:"Voiceless bilabial plosive",
         audio:"https://commons.wikimedia.org/wiki/Special:FilePath/Voiceless_bilabial_plosive.ogg",
         license:"Audio © Wikimedia Commons — voir la fiche" }, // :contentReference[oaicite:10]{index=10}
  "b": { name:"Voiced bilabial plosive",
         audio:"https://commons.wikimedia.org/wiki/Special:FilePath/Voiced_bilabial_plosive.ogg",
         license:"Audio © Wikimedia Commons — voir la fiche" }, // (présent en catégories fricatives/plosives)
  "t": { name:"Voiceless alveolar stop",
         audio:"https://commons.wikimedia.org/wiki/Special:FilePath/Voiceless_alveolar_stop.ogg",
         license:"Audio © Wikimedia Commons — voir la fiche" }, // :contentReference[oaicite:11]{index=11}
  "d": { name:"Voiced alveolar stop",
         audio:"https://commons.wikimedia.org/wiki/Special:FilePath/Voiced_alveolar_stop.ogg",
         license:"Audio © Wikimedia Commons — voir la fiche" }, // :contentReference[oaicite:12]{index=12}
  "k": { name:"Voiceless velar stop",
         audio:"https://commons.wikimedia.org/wiki/Special:FilePath/Voiceless_velar_plosive.ogg",
         license:"Audio © Wikimedia Commons — voir la fiche" },
  "g": { name:"Voiced velar stop",
         audio:"https://commons.wikimedia.org/wiki/Special:FilePath/Voiced_velar_plosive.ogg",
         license:"Audio © Wikimedia Commons — voir la fiche" },
  "ʔ": { name:"Glottal stop",
         audio:"https://commons.wikimedia.org/wiki/Special:FilePath/Glottal_stop.ogg",
         license:"Audio © Wikimedia Commons — voir la fiche" }, // :contentReference[oaicite:13]{index=13}

  // Fricatives
  "f": { name:"Voiceless labiodental fricative",
         audio:"https://commons.wikimedia.org/wiki/Special:FilePath/Voiceless_labiodental_fricative.ogg",
         license:"Audio © Wikimedia Commons — voir la fiche" },
  "v": { name:"Voiced labiodental fricative",
         audio:"https://commons.wikimedia.org/wiki/Special:FilePath/Voiced_labiodental_fricative.ogg",
         license:"Audio © Wikimedia Commons — voir la fiche" }, // :contentReference[oaicite:14]{index=14}
  "θ": { name:"Voiceless dental fricative",
         audio:"https://commons.wikimedia.org/wiki/Special:FilePath/Voiceless_dental_fricative.ogg",
         license:"Audio © Wikimedia Commons — voir la fiche" }, // :contentReference[oaicite:15]{index=15}
  "ð": { name:"Voiced dental fricative",
         audio:"https://commons.wikimedia.org/wiki/Special:FilePath/Voiced_dental_fricative.ogg",
         license:"Audio © Wikimedia Commons — voir la fiche" }, // :contentReference[oaicite:16]{index=16}
  "s": { name:"Voiceless alveolar fricative",
         audio:"https://commons.wikimedia.org/wiki/Special:FilePath/Voiceless_alveolar_fricative.ogg",
         license:"Audio © Wikimedia Commons — voir la fiche" },
  "z": { name:"Voiced alveolar fricative",
         audio:"https://commons.wikimedia.org/wiki/Special:FilePath/Voiced_alveolar_sibilant.ogg",
         license:"Audio © Wikimedia Commons — voir la fiche" }, // :contentReference[oaicite:17]{index=17}
  "ʃ": { name:"Voiceless postalveolar fricative",
         audio:"https://commons.wikimedia.org/wiki/Special:FilePath/Voiceless_postalveolar_fricative.ogg",
         license:"Audio © Wikimedia Commons — voir la fiche" }, // :contentReference[oaicite:18]{index=18}
  "ʒ": { name:"Voiced postalveolar fricative",
         audio:"https://commons.wikimedia.org/wiki/Special:FilePath/Voiced_postalveolar_fricative.ogg",
         license:"Audio © Wikimedia Commons — voir la fiche" },
  "h": { name:"Voiceless glottal fricative",
         audio:"https://commons.wikimedia.org/wiki/Special:FilePath/Voiceless_glottal_fricative.ogg",
         license:"Audio © Wikimedia Commons — voir la fiche" },

  // Nasales
  "m": { name:"Bilabial nasal",
         audio:"https://commons.wikimedia.org/wiki/Special:FilePath/Bilabial_nasal.ogg",
         license:"Audio © Wikimedia Commons — voir la fiche" },
  "n": { name:"Alveolar nasal",
         audio:"https://commons.wikimedia.org/wiki/Special:FilePath/Alveolar_nasal.ogg",
         license:"Audio © Wikimedia Commons — voir la fiche" },
  "ŋ": { name:"Velar nasal",
         audio:"https://commons.wikimedia.org/wiki/Special:FilePath/Velar_nasal.ogg",
         license:"Audio © Wikimedia Commons — voir la fiche" }, // :contentReference[oaicite:19]{index=19}

  // Approximantes et latérales
  "l": { name:"Alveolar lateral approximant",
         audio:"https://commons.wikimedia.org/wiki/Special:FilePath/Alveolar_lateral_approximant.ogg",
         license:"Audio © Wikimedia Commons — voir la fiche" }, // :contentReference[oaicite:20]{index=20}
  "ɹ": { name:"Alveolar approximant",
         audio:"https://commons.wikimedia.org/wiki/Special:FilePath/Alveolar_approximant.ogg",
         license:"Audio © Wikimedia Commons — voir la fiche" }, // :contentReference[oaicite:21]{index=21}
  "j": { name:"Palatal approximant",
         audio:"https://commons.wikimedia.org/wiki/Special:FilePath/Palatal_approximant.ogg",
         license:"Audio © Wikimedia Commons — voir la fiche" }, // :contentReference[oaicite:22]{index=22}
  "w": { name:"Labio-velar approximant",
         audio:"https://commons.wikimedia.org/wiki/Special:FilePath/Labio-velar_approximant.ogg",
         license:"Audio © Wikimedia Commons — voir la fiche" },
  "ɾ": { name:"Alveolar tap",
         audio:"https://commons.wikimedia.org/wiki/Special:FilePath/Alveolar_tap.ogg",
         license:"Audio © Wikimedia Commons — voir la fiche" },

  // Diacritiques courants qu’on affiche sans audio
  "ː": { name:"Length mark" },
  "ˈ": { name:"Primary stress" },
  "ˌ": { name:"Secondary stress" }
};

function updateMeta(entry){
  const meta = PHONO[(entry.ch||'').trim()] || {};
  // Stencil side
  document.getElementById('nameStencil').textContent = meta.name || '';
  const aS = document.getElementById('audioStencil');
  const lS = document.getElementById('licStencil');
  if (meta.audio){ aS.src = meta.audio; aS.style.display='inline-block'; }
  else { aS.removeAttribute('src'); aS.style.display='none'; }
  lS.textContent = meta.license || '';
  // Canvas side
  document.getElementById('nameCanvas').textContent = meta.name || '';
  const aC = document.getElementById('audioCanvas');
  const lC = document.getElementById('licCanvas');
  if (meta.audio){ aC.src = meta.audio; aC.style.display='inline-block'; }
  else { aC.removeAttribute('src'); aC.style.display='none'; }
  lC.textContent = meta.license || '';
}

/* chemins */
function basenameFromEntry(s){
  if (s.file && s.file.includes('/')) return s.file.split('/').pop();
  if (s.file) return s.file;
  const ch = s.ch || '';
  const bad = '/\\:*?"<>| ';
  if (ch && [...bad].every(c=>!ch.includes(c))) return ch + '.svg';
  const cp = (ch && ch.codePointAt) ? ch.codePointAt(0).toString(16).toUpperCase() : "0000";
  return 'u' + cp + '.svg';
}
function pathFor(s){ return `svgs/${FONT_KEY}/${basenameFromEntry(s)}?${BUST}`; }

/* data */
async function loadSymbols(){
  const r = await fetch('symbols.json?'+BUST);
  const j = await r.json();
  const seen = new Set();
  symbols = (j.symbols||[])
    .filter(s => (s.ch||'').trim() !== '')
    .filter(s => { const k=(s.ch||'').trim(); if(seen.has(k)) return false; seen.add(k); return true; });
}

/* grille: n’affiche que ce qui existe */
async function buildGrid(){
  const grid = document.getElementById('grid'); grid.innerHTML = '';
  available = [];
  await Promise.all(symbols.map(s => new Promise(resolve=>{
    const img = new Image();
    img.onload = ()=>{ available.push(s); addTile(s); resolve(); };
    img.onerror = ()=>resolve();
    img.src = pathFor(s);
  })));
  if (available.length) selectSymbolByEntry(available[0]);
}
function addTile(s){
  const grid = document.getElementById('grid');
  const t = document.createElement('div'); t.className='tile';
  const img = document.createElement('img'); img.src = pathFor(s); img.alt = s.ch;
  t.appendChild(img);
  t.addEventListener('click', ()=>selectSymbolByEntry(s));
  grid.appendChild(t);
}

/* fit */
function fitRect(imgW, imgH, boxW=SIZE, boxH=SIZE){
  const rImg = imgW/Math.max(1,imgH), rBox = boxW/boxH;
  let dw, dh, dx, dy;
  if (rImg > rBox){ dw = boxW; dh = Math.round(dw/rImg); dx = 0; dy = Math.round((boxH-dh)/2); }
  else { dh = boxH; dw = Math.round(dh*rImg); dy = 0; dx = Math.round((boxW-dw)/2); }
  return {dx, dy, dw, dh};
}

/* stencil display */
function showStencil(entry){
  const url = pathFor(entry);
  const img = document.getElementById('stencil');
  img.onload = ()=>{
    const size = getStageSize();
    const fit = fitRect(img.naturalWidth||size, img.naturalHeight||size, size, size);
    img.style.left = fit.dx+'px'; img.style.top = fit.dy+'px';
    img.style.width = fit.dw+'px'; img.style.height = fit.dh+'px';
  };
  img.src = url;
}

/* svg -> mask */
async function svgToMask(entry){
  const url = pathFor(entry);
  return new Promise((resolve)=>{
    const img = new Image(); img.crossOrigin='anonymous';
    img.onload = ()=>{
      const size = getStageSize();
      const fit = fitRect(img.naturalWidth||size, img.naturalHeight||size, size, size);
      const off = document.createElement('canvas'); off.width=size; off.height=size;
      const cx = off.getContext('2d');
      cx.fillStyle = '#fff'; cx.fillRect(0,0,size,size);
      cx.drawImage(img, fit.dx, fit.dy, fit.dw, fit.dh);
      const data = cx.getImageData(0,0,size,size).data;
      const mask = new Uint8Array(size*size);
      for(let i=0,p=0;i<data.length;i+=4,p++){
        const lum = data[i]*.2126 + data[i+1]*.7152 + data[i+2]*.0722;
        mask[p] = (lum < THRESH) ? 1 : 0;
      }
      MODEL_SIZE = size;
      resolve(mask);
    };
    img.src = url;
  });
}

/* sélection */
async function selectSymbolByEntry(entry){
  // highlight
  const tiles = Array.from(document.querySelectorAll('.tile'));
  tiles.forEach(t => t.classList.remove('active'));
  const idx = available.indexOf(entry);
  if (idx >= 0 && tiles[idx]) tiles[idx].classList.add('active');

  current = entry;
  resetCanvas();
  showStencil(current);
  updateMeta(current);
  modelMask = await svgToMask(current);
}

/* canvas dynamique */
const pad = document.getElementById('pad');
const ctx  = pad.getContext('2d', {desynchronized:true});
function getStageSize(){
  const stages = Array.from(document.querySelectorAll('.stage'));
  const w = Math.max(140, Math.min(300, Math.floor(Math.min(...stages.map(s => s.getBoundingClientRect().width)) || 280)));
  SIZE = w; return w;
}
function setupCanvasBase(){
  const size = getStageSize();
  const dpr = Math.max(1, window.devicePixelRatio||1);
  pad.width  = Math.round(size*dpr);
  pad.height = Math.round(size*dpr);
  pad.style.width  = size+'px';
  pad.style.height = size+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
function resetCanvas(){
  setupCanvasBase();
  ctx.fillStyle = '#fff'; ctx.fillRect(0,0,SIZE,SIZE);
  ctx.lineCap='round'; ctx.strokeStyle='#000'; ctx.lineWidth = LINE_WIDTH;
  document.getElementById('out').style.display='none';
}
resetCanvas();

window.addEventListener('resize', async ()=>{
  const prev = SIZE;
  resetCanvas();
  if (current && SIZE !== prev){
    showStencil(current);
    modelMask = await svgToMask(current);
  }
});

/* mobile no-scroll */
pad.style.touchAction='none';
pad.addEventListener('touchstart', e=>e.preventDefault(), {passive:false});
pad.addEventListener('touchmove',  e=>e.preventDefault(), {passive:false});

/* dessin */
let drawing=false, last=null;
pad.addEventListener('pointerdown', e=>{ pad.setPointerCapture?.(e.pointerId); drawing=true; last=getXY(e); });
pad.addEventListener('pointerup',   ()=>{ drawing=false; last=null; });
pad.addEventListener('pointercancel',()=>{ drawing=false; last=null; });
pad.addEventListener('pointermove', e=>{
  if(!drawing) return;
  const {x,y} = getXY(e);
  if(last){ ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(x,y); ctx.stroke(); }
  last = {x,y};
});
function getXY(e){
  const r = pad.getBoundingClientRect();
  return { x: Math.round((e.clientX-r.left)*(SIZE/r.width)),
           y: Math.round((e.clientY-r.top) *(SIZE/r.height)) };
}

/* boutons */
function clearPad(){
  resetCanvas();
  if (current){ showStencil(current); updateMeta(current); svgToMask(current).then(m=>modelMask=m); }
}
document.getElementById('clear').onclick = ()=>clearPad();

document.getElementById('eval').onclick = async ()=>{
  if (!current) return;
  if (!modelMask || MODEL_SIZE !== SIZE){
    modelMask = await svgToMask(current);
  }
  const userMask = canvasToMask();
  const m = dilate(modelMask, SIZE, DILATION_ITERS);
  const inter = intersect(userMask, m);
  const sumU = sum(userMask), sumM = sum(modelMask);
  const denom = sumU + sumM;
  const dice = denom ? (2*inter/denom) : 0;

  let text;
  if (dice <= 0.35) text = "You can do better!";
  else if (dice <= 0.60) text = "Getting there!";
  else text = "Yay!!";

  const out = document.getElementById('out');
  out.textContent = `${(dice*100).toFixed(1)}% — ${text}`;
  out.style.display='inline-block';
};

/* masques et morpho */
function canvasToMask(){
  const data = ctx.getImageData(0,0,SIZE,SIZE).data;
  const mask = new Uint8Array(SIZE*SIZE);
  for(let i=0,p=0;i<data.length;i+=4,p++){
    const lum = data[i]*.2126 + data[i+1]*.7152 + data[i+2]*.0722;
    mask[p] = (lum < THRESH) ? 1 : 0;
  }
  return mask;
}
function sum(m){ let s=0; for(let i=0;i<m.length;i++) s+=m[i]; return s; }
function intersect(a,b){ let s=0; for(let i=0;i<a.length;i++) s += (a[i]&&b[i])?1:0; return s; }
function dilate(mask,size,it){
  if(it<=0) return mask.slice();
  let out = mask.slice();
  for(let k=0;k<it;k++){
    const next = out.slice();
    for(let y=1;y<size-1;y++){
      for(let x=1;x<size-1;x++){
        const i=y*size+x;
        if(out[i]){ next[i]=1; continue; }
        if(out[i-1]||out[i+1]||out[i-size]||out[i+size]) next[i]=1;
      }
    }
    out = next;
  }
  return out;
}
