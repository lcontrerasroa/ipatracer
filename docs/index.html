<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8fafc">
<title>IPA tracer</title>
<style>
  :root{
    --bg:#f8fafc; --card:#fff; --ink:#0f172a; --muted:#475569; --border:#e2e8f0;
    --accent:#60a5fa; --accent2:#a78bfa; --guide:#bfdbfe;
    --size:300px;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);
       padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  button,select,input{font:inherit;touch-action:manipulation}
  .wrap{max-width:1100px;margin:0 auto;padding:0 12px}

  header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0 6px}
  header h1{margin:0;font-size:20px;font-weight:800}
  .iconbtn{min-width:40px;height:40px;border:1px solid var(--border);border-radius:10px;background:var(--card);color:var(--ink);cursor:pointer;font-size:18px;line-height:1}
  .iconbtn:disabled{opacity:.4;cursor:default}

  .tabs{display:flex;gap:2px;background:#e2e8f0;border-radius:999px;padding:3px}
  .tabs button{border:0;background:transparent;min-height:34px;padding:4px 12px;border-radius:999px;cursor:pointer;font-size:14px;color:var(--muted)}
  .tabs button[aria-selected="true"]{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(15,23,42,.1)}

  /* Exercice sur des mots */
  .word{margin-bottom:8px}
  .wordrow{display:flex;align-items:center;gap:10px}
  .wordtext{flex:1;font-size:26px;font-weight:800;min-width:0;overflow-wrap:anywhere}
  .wordrow .listen{margin-top:0}
  .slots{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:8px;min-height:58px}
  .slot{display:flex;flex-direction:column;align-items:center;gap:2px}
  .slot .box{width:40px;height:40px;border:1px solid var(--border);border-radius:8px;background:#fff;overflow:hidden;display:grid;place-items:center}
  .slot .box img{width:52px;height:52px;margin:-6px}
  .slot.current .box{outline:2px solid var(--accent);outline-offset:-1px}
  .slot.good .box{background:#dcfce7} .slot.mid .box{background:#fef9c3} .slot.bad .box{background:#fee2e2}
  .slot .pct{font-size:11px;color:var(--muted);min-height:1.2em}

  .controls{display:none;flex-wrap:wrap;gap:8px;justify-content:center;padding-bottom:8px}
  .controls.open{display:flex}
  .chip{display:flex;align-items:center;gap:8px;background:linear-gradient(180deg,#eef2ff,#e0f2fe);
        border:1px solid var(--border);border-radius:999px;padding:6px 12px}
  .chip label{font-size:13px;color:var(--muted)}
  .chip input[type="range"]{accent-color:var(--accent);width:130px}
  .chip output{font-size:13px;color:var(--muted);min-width:2ch;text-align:right}
  select{padding:6px 8px;border:1px solid var(--border);border-radius:10px;background:#fff;color:var(--ink)}
  .switch{appearance:none;-webkit-appearance:none;margin:0;width:40px;height:24px;border-radius:999px;background:#cbd5e1;position:relative;outline:none;border:1px solid var(--border);cursor:pointer;flex:none}
  .switch:checked{background:#93c5fd}
  .switch::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
  .switch:checked::after{left:18px}
  .switch:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* Bande de symboles : défilement horizontal sur mobile */
  .grid{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x proximity;padding:2px 2px 8px;scrollbar-width:thin}
  .tile{flex:0 0 52px;height:52px;padding:0;background:var(--card);border:1px solid var(--border);border-radius:10px;
        overflow:hidden;cursor:pointer;scroll-snap-align:center;display:grid;place-items:center}
  .tile img{width:66px;height:66px;margin:-7px;pointer-events:none}
  .tile.active{outline:2px solid var(--accent);outline-offset:-2px;background:#eff6ff}
  .tile:focus-visible{outline:2px solid var(--accent2);outline-offset:-2px}

  .panel{display:flex;flex-direction:column;gap:8px;margin-top:2px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:8px}
  .card h3{display:none;margin:0 0 .4rem;font-size:14px;color:var(--muted);font-weight:700;text-align:center}

  /* Cible : ligne compacte sur mobile */
  .target{display:flex;align-items:center;gap:10px}
  #stencilBox{position:relative;width:72px;aspect-ratio:1/1;flex:none;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:#fff}
  #stencil{position:absolute;inset:0;width:100%;height:100%}
  #stencilBox.hidden #stencil, #stencilBox.hidden .guides{visibility:hidden}
  #stencilBox.hidden::after{content:"?";position:absolute;inset:0;display:grid;place-items:center;font-size:32px;font-weight:800;color:#cbd5e1}
  .meta{flex:1;min-width:0}
  .meta .name{font-size:14px;color:#334155}
  .meta .license{display:block;font-size:11px;color:#64748b;margin-top:2px}
  .listen{margin-top:4px;padding:6px 12px;border:1px solid var(--border);border-radius:999px;background:#f0f9ff;color:var(--ink);cursor:pointer;font-size:14px}
  .nav{display:flex;gap:6px;flex:none}

  /* Zone de dessin */
  .stage{position:relative;width:var(--size);height:var(--size);margin:0 auto;
         -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  .stage canvas, .stage .ghost, .guides{position:absolute;inset:0;width:100%;height:100%}
  #pad{background:#fff;border-radius:12px;border:1px solid var(--border);touch-action:none;z-index:1;cursor:crosshair}
  #ghost{opacity:.18;pointer-events:none;display:none;z-index:2}
  #fb{pointer-events:none;z-index:3}
  .guides{pointer-events:none;z-index:4;
    background-image:
      linear-gradient(to right, rgba(0,0,0,0.08) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(0,0,0,0.08) 1px, transparent 1px);
    background-size:12.5% 12.5%}
  .guides .line{position:absolute;left:0;right:0;border-top:1px solid var(--guide)}
  .guides .xh{border-top-style:dashed}

  .actions{display:flex;gap:8px;justify-content:center;margin-top:8px}
  .btn{flex:1;max-width:150px;min-height:44px;padding:8px 12px;border:none;border-radius:12px;color:#fff;cursor:pointer;
       box-shadow:0 2px 6px rgba(99,102,241,.18);font-weight:600;font-size:15px}
  .btn:disabled{opacity:.45;cursor:default}
  .btn.eval{background:linear-gradient(180deg,var(--accent),#3b82f6)}
  .btn.clear{background:linear-gradient(180deg,#a5b4fc,var(--accent2))}
  .btn.undo{background:#fff;color:var(--ink);border:1px solid var(--border);box-shadow:none}
  .score{text-align:center;font-weight:700;font-size:15px;min-height:1.5em;margin-top:6px;color:#0b7669}
  .score .hint{display:block;font-weight:400;font-size:13px;color:var(--muted)}
  .score .miss{color:#dc2626} .score .over{color:#d97706}

  @media (min-width:760px){
    #settingsBtn{display:none}
    .controls{display:flex}
    .grid{flex-wrap:wrap;justify-content:center;overflow:visible}
    .panel{display:grid;grid-template-columns:1fr 1fr;align-items:start;margin-top:6px}
    .card h3{display:block}
    .target{flex-direction:column;align-items:stretch}
    #stencilBox{width:var(--size);margin:0 auto}
    .meta{text-align:center}
    .nav{justify-content:center}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>IPA tracer</h1>
    <div class="tabs" role="tablist">
      <button role="tab" data-mode="symbols" aria-selected="true">Symbols</button>
      <button role="tab" data-mode="words" aria-selected="false">Words</button>
    </div>
    <button id="settingsBtn" class="iconbtn" aria-label="Settings" aria-expanded="false" aria-controls="controls">⚙</button>
  </header>
  <div id="controls" class="controls">
    <div class="chip">
      <label for="fontpick">Font</label>
      <select id="fontpick">
        <option value="andika">Andika</option>
        <option value="mplus">M PLUS</option>
        <option value="arimo">Arimo</option>
        <option value="dejavu">DejaVu Sans</option>
        <option value="cmu">CMU Bright</option>
      </select>
    </div>
    <div class="chip">
      <label for="lw">Stroke</label>
      <input id="lw" type="range" min="6" max="60" value="24">
      <output id="lw_out" for="lw">24</output>
    </div>
    <div class="chip">
      <label for="help">Guide</label>
      <input id="help" class="switch" type="checkbox">
    </div>
    <div class="chip">
      <label for="quiz">Quiz</label>
      <input id="quiz" class="switch" type="checkbox">
    </div>
  </div>
</div>

<main class="wrap">
  <div id="grid" class="grid" role="listbox" aria-label="Symbols"></div>

  <div id="wordCard" class="card word" hidden>
    <div class="wordrow">
      <span id="wordText" class="wordtext"></span>
      <button id="wordListen" class="listen" hidden>▶ Listen</button>
      <button id="wordNext" class="iconbtn" aria-label="Next word">›</button>
    </div>
    <div id="slots" class="slots"></div>
  </div>

  <div class="panel">
    <div class="card" id="targetCard">
      <h3>Stencil</h3>
      <div class="target">
        <div id="stencilBox">
          <img id="stencil" alt="">
          <div class="guides"><div class="line base"></div><div class="line xh"></div></div>
        </div>
        <div class="meta">
          <div id="nameStencil" class="name"></div>
          <button id="listen" class="listen" hidden>▶ Listen</button>
          <small id="licStencil" class="license"></small>
        </div>
        <div class="nav">
          <button id="prev" class="iconbtn" aria-label="Previous symbol">‹</button>
          <button id="next" class="iconbtn" aria-label="Next symbol">›</button>
        </div>
      </div>
    </div>

    <div class="card" id="padCard">
      <h3>Draw</h3>
      <div class="stage" id="padStage">
        <canvas id="pad" aria-label="Drawing area"></canvas>
        <img id="ghost" class="ghost" alt="">
        <canvas id="fb"></canvas>
        <div class="guides"><div class="line base"></div><div class="line xh"></div></div>
      </div>
      <div class="actions">
        <button id="undo" class="btn undo" disabled>Undo</button>
        <button id="clear" class="btn clear">Clear</button>
        <button id="eval" class="btn eval">Check</button>
      </div>
      <div id="out" class="score" aria-live="polite"></div>
    </div>
  </div>
</main>

<script>
/* -------- Réglages -------- */
const VERSION = '4';      // à incrémenter quand les SVG changent (cache)
const N = 200;            // résolution de l'évaluation, indépendante de l'écran
const REF = 300;          // l'épaisseur du trait est exprimée pour un canevas de 300 px
const THRESH = 235;
const TOL = Math.round(N * 0.04);   // tolérance de position (px à la résolution N)

/* -------- localStorage protégé (navigation privée, etc.) -------- */
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : v; } catch { return d; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch {} }
};

let symbols = [];
let idx = -1, current = null;
let SIZE = 0;
let model = null;          // {mask, dist, tolR}
let modelToken = 0;
let strokes = [];          // [{w, pts:[[x,y],…]}], coordonnées normalisées 0..1
let revealed = true;

const $ = id => document.getElementById(id);
const pad = $('pad'), fb = $('fb');
const ctx = pad.getContext('2d');
const fbx = fb.getContext('2d');

/* -------- Panneau de réglages (mobile) -------- */
$('settingsBtn').onclick = ()=>{
  const open = $('controls').classList.toggle('open');
  $('settingsBtn').setAttribute('aria-expanded', open);
  applySize(true);
};

/* -------- Fonte (Andika défaut) -------- */
let FONT_KEY = store.get('ipa_font', 'andika');
const fontpick = $('fontpick');
fontpick.value = FONT_KEY;
if (fontpick.value !== FONT_KEY){ FONT_KEY = 'andika'; fontpick.value = FONT_KEY; }
fontpick.addEventListener('change', async e=>{
  FONT_KEY = e.target.value;
  store.set('ipa_font', FONT_KEY);
  buildGrid();
  await loadMetrics();
  if (MODE === 'words' && W) setSlot(W.i);
  else if (current) select(idx);
});

/* -------- Épaisseur du trait (vaut pour les traits suivants) -------- */
let LINE_WIDTH = Number(store.get('ipa_lw', 24)) || 24;
const lw = $('lw');
function setLW(v){
  LINE_WIDTH = Math.min(60, Math.max(6, Number(v) || 24));
  lw.value = LINE_WIDTH; $('lw_out').textContent = LINE_WIDTH;
  store.set('ipa_lw', LINE_WIDTH);
}
lw.oninput = e=>setLW(e.target.value);
setLW(LINE_WIDTH);

/* -------- Guide (fantôme) et quiz -------- */
const help = $('help'), quiz = $('quiz');
help.checked = store.get('ipa_help', '0') === '1';
quiz.checked = store.get('ipa_quiz', '0') === '1';
help.addEventListener('change', ()=>{ store.set('ipa_help', help.checked ? '1' : '0'); syncGhost(); });
quiz.addEventListener('change', ()=>{ store.set('ipa_quiz', quiz.checked ? '1' : '0'); setRevealed(!quiz.checked); });

function setRevealed(v){
  revealed = v;
  $('stencilBox').classList.toggle('hidden', !v);
  syncGhost();
}
function syncGhost(){
  const g = $('ghost');
  const on = current && help.checked && revealed && MODE === 'symbols';
  g.style.display = on ? 'block' : 'none';
  if (on) g.src = pathFor(current);
}

/* -------- Fichiers -------- */
function stem(ch){
  const unsafe = '\\/:*?"<>| ';
  return unsafe.includes(ch) ? 'u' + ch.codePointAt(0).toString(16).toUpperCase().padStart(4, '0') : ch;
}
function pathFor(s, font = FONT_KEY){ return `svgs/${font}/${stem(s.ch)}.svg?v=${VERSION}`; }

const COMMONS = 'https://upload.wikimedia.org/wikipedia/commons/';
function audioURL(p){
  const name = p.split('/').pop();
  const mp3 = `${COMMONS}transcoded/${p}.ogg/${name}.ogg.mp3`;
  const ogg = `${COMMONS}${p}.ogg`;
  // Safari iOS ne lit pas toujours l'Ogg : MP3 en priorité
  return new Audio().canPlayType('audio/mpeg') ? mp3 : ogg;
}

/* -------- Chargement -------- */
async function loadSymbols(){
  const r = await fetch('symbols.json?v=' + VERSION);
  const j = await r.json();
  const seen = new Set();
  symbols = (j.symbols || []).filter(s => {
    const k = (s.ch || '').trim();
    if (!k || seen.has(k)) return false;
    seen.add(k); return true;
  });
}

async function loadMetrics(){
  let m = {};
  try { m = await (await fetch(`svgs/${FONT_KEY}/metrics.json?v=${VERSION}`)).json(); } catch {}
  document.querySelectorAll('.guides').forEach(g=>{
    const base = g.querySelector('.base'), xh = g.querySelector('.xh');
    base.style.display = m.baseline ? '' : 'none';
    xh.style.display = m.xheight ? '' : 'none';
    if (m.baseline) base.style.top = (m.baseline * 100) + '%';
    if (m.xheight) xh.style.top = (m.xheight * 100) + '%';
  });
}

/* -------- Grille (les SVG manquants masquent leur tuile) -------- */
function buildGrid(){
  const grid = $('grid'); grid.innerHTML = '';
  symbols.forEach((s, i)=>{
    const t = document.createElement('button');
    t.className = 'tile'; t.setAttribute('role', 'option');
    t.setAttribute('aria-label', s.name ? `${s.ch} (${s.name})` : s.ch);
    const img = document.createElement('img');
    img.alt = ''; img.src = pathFor(s);
    img.onerror = ()=>{ t.hidden = true; };
    t.appendChild(img);
    t.addEventListener('click', ()=>select(i));
    grid.appendChild(t);
  });
  markActive();
}
function markActive(){
  document.querySelectorAll('.tile').forEach((t, i)=>{
    t.classList.toggle('active', i === idx);
    t.setAttribute('aria-selected', i === idx);
  });
}

/* -------- Sélection symbole -------- */
async function select(i){
  idx = (i + symbols.length) % symbols.length;
  current = symbols[idx];
  store.set('ipa_last', current.ch);
  markActive();
  const tile = document.querySelectorAll('.tile')[idx];
  tile?.scrollIntoView({block:'nearest', inline:'center', behavior:'smooth'});

  strokes = []; redraw(); clearFeedback(); setOut('');
  $('stencil').src = pathFor(current);
  $('stencil').alt = current.ch;
  updateMeta(current);
  setRevealed(!quiz.checked);

  const token = ++modelToken;
  const m = await getModel(current);
  if (token === modelToken) model = m;
}
function step(d){
  if (!symbols.length) return;
  if (quiz.checked && symbols.length > 1){
    let j; do { j = Math.floor(Math.random() * symbols.length); } while (j === idx);
    select(j);
  } else select(idx + d);
}
$('prev').onclick = ()=>step(-1);
$('next').onclick = ()=>step(1);

/* -------- Métadonnées et audio -------- */
let player = null;
function updateMeta(s){
  $('nameStencil').textContent = s.name || '';
  $('listen').hidden = !s.audio;
  $('licStencil').textContent = s.audio ? 'Audio: Wikimedia Commons' : '';
}
$('listen').onclick = ()=>{
  if (!current?.audio) return;
  if (player) player.pause();
  player = new Audio(audioURL(current.audio));
  player.play().catch(()=>{});
};

/* -------- SVG -> modèle (masque + distances) -------- */
const models = new Map();   // cache par police et symbole
function getModel(entry){
  const k = FONT_KEY + '|' + entry.ch;
  if (!models.has(k)) models.set(k, buildModel(entry));
  return models.get(k);
}
function buildModel(entry){
  return new Promise(resolve=>{
    const img = new Image();
    img.onload = ()=>{
      const c = document.createElement('canvas'); c.width = c.height = N;
      const x = c.getContext('2d');
      x.fillStyle = '#fff'; x.fillRect(0, 0, N, N);
      x.drawImage(img, 0, 0, N, N);
      const mask = toMask(x.getImageData(0, 0, N, N).data);
      // Squelette approché : crêtes de la distance au bord
      const inside = distTo(mask.map(v => 1 - v));
      const skel = new Uint8Array(N * N);
      const vals = [];
      for (let y = 1; y < N-1; y++) for (let x = 1; x < N-1; x++){
        const i = y*N + x, v = inside[i];
        if (!mask[i]) continue;
        vals.push(v);
        if (v >= inside[i-1] && v >= inside[i+1] && v >= inside[i-N] && v >= inside[i+N]) skel[i] = 1;
      }
      // demi-épaisseur du glyphe (95e centile), pour l'affichage des manques
      vals.sort((a, b)=>a - b);
      const hw = vals.length ? vals[Math.floor(vals.length * .95)] : 0;
      resolve({ mask, skel, dist: distTo(mask), dSkel: distTo(skel), hw });
    };
    img.onerror = ()=>resolve(null);
    img.src = pathFor(entry);
  });
}

function toMask(data){
  const mask = new Uint8Array(N * N);
  for (let i = 0, p = 0; i < data.length; i += 4, p++){
    const lum = data[i]*.2126 + data[i+1]*.7152 + data[i+2]*.0722;
    mask[p] = lum < THRESH ? 1 : 0;
  }
  return mask;
}

/* Distance de chanfrein 3-4 au pixel « 1 » le plus proche, en pixels */
function distTo(mask){
  const d = new Float32Array(N * N);
  for (let i = 0; i < d.length; i++) d[i] = mask[i] ? 0 : 1e9;
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++){
    const i = y*N + x; let v = d[i]; if (!v) continue;
    if (x > 0) v = Math.min(v, d[i-1] + 3);
    if (y > 0){
      v = Math.min(v, d[i-N] + 3);
      if (x > 0) v = Math.min(v, d[i-N-1] + 4);
      if (x < N-1) v = Math.min(v, d[i-N+1] + 4);
    }
    d[i] = v;
  }
  for (let y = N-1; y >= 0; y--) for (let x = N-1; x >= 0; x--){
    const i = y*N + x; let v = d[i]; if (!v) continue;
    if (x < N-1) v = Math.min(v, d[i+1] + 3);
    if (y < N-1){
      v = Math.min(v, d[i+N] + 3);
      if (x < N-1) v = Math.min(v, d[i+N+1] + 4);
      if (x > 0) v = Math.min(v, d[i+N-1] + 4);
    }
    d[i] = v;
  }
  for (let i = 0; i < d.length; i++) d[i] /= 3;
  return d;
}

/* -------- Taille du canevas -------- */
// Calculée sur la largeur disponible et la hauteur de l'écran, mais seulement
// quand la largeur change : la barre d'adresse mobile qui se replie ne doit
// pas redimensionner (ni effacer) le dessin.
let lastW = 0;
function applySize(force){
  if (!force && window.innerWidth === lastW) return;
  lastW = window.innerWidth;
  const card = $('padCard'), stage = $('padStage');
  const cs = getComputedStyle(card);
  const w = card.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const top = stage.getBoundingClientRect().top + window.scrollY;
  const h = window.innerHeight - top - 100;   // place pour les boutons et le score
  const s = Math.round(Math.max(220, Math.min(w, h, 520)));
  if (s === SIZE) return;
  SIZE = s;
  document.documentElement.style.setProperty('--size', SIZE + 'px');
  const dpr = Math.min(3, window.devicePixelRatio || 1);
  for (const c of [pad, fb]){ c.width = c.height = Math.round(SIZE * dpr); }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  fbx.setTransform(dpr, 0, 0, dpr, 0, 0);
  redraw(); clearFeedback();
}
window.addEventListener('resize', ()=>applySize(false));
window.addEventListener('orientationchange', ()=>setTimeout(()=>applySize(true), 200));

/* -------- Dessin -------- */
function strokeStyle(c, w){
  c.lineCap = 'round'; c.lineJoin = 'round';
  c.strokeStyle = '#000'; c.fillStyle = '#000'; c.lineWidth = w;
}
function drawStroke(c, s, size){
  const p = s.pts, w = s.w * size;
  strokeStyle(c, w);
  if (p.length === 1){
    c.beginPath(); c.arc(p[0][0]*size, p[0][1]*size, w/2, 0, Math.PI*2); c.fill();
    return;
  }
  c.beginPath(); c.moveTo(p[0][0]*size, p[0][1]*size);
  for (let k = 1; k < p.length; k++) c.lineTo(p[k][0]*size, p[k][1]*size);
  c.stroke();
}
function redraw(){
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, SIZE, SIZE);
  strokes.forEach(s=>drawStroke(ctx, s, SIZE));
  $('undo').disabled = !strokes.length;
}

let live = null, activeId = null, penSeen = false;
function pt(e){
  const r = pad.getBoundingClientRect();
  return [(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height];
}
pad.addEventListener('pointerdown', e=>{
  if (e.pointerType === 'pen') penSeen = true;
  if (e.pointerType === 'touch' && penSeen) return;    // paume posée avec un stylet
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  if (activeId !== null) return;                        // un seul doigt à la fois
  e.preventDefault();
  activeId = e.pointerId;
  pad.setPointerCapture?.(e.pointerId);
  clearFeedback();
  live = { w: LINE_WIDTH / REF, pts: [pt(e)] };
  strokes.push(live);
  drawStroke(ctx, live, SIZE);
  $('undo').disabled = false;
});
pad.addEventListener('pointermove', e=>{
  if (e.pointerId !== activeId || !live) return;
  const evs = e.getCoalescedEvents?.() || [];
  strokeStyle(ctx, live.w * SIZE);
  ctx.beginPath();
  let q = live.pts[live.pts.length - 1];
  ctx.moveTo(q[0]*SIZE, q[1]*SIZE);
  for (const ev of (evs.length ? evs : [e])){
    q = pt(ev); live.pts.push(q);
    ctx.lineTo(q[0]*SIZE, q[1]*SIZE);
  }
  ctx.stroke();
});
function endStroke(e){
  if (e.pointerId !== activeId) return;
  activeId = null; live = null;
}
pad.addEventListener('pointerup', endStroke);
pad.addEventListener('pointercancel', endStroke);
// iOS : empêcher défilement, zoom et loupe pendant le tracé
pad.addEventListener('touchstart', e=>e.preventDefault(), {passive:false});
pad.addEventListener('touchmove', e=>e.preventDefault(), {passive:false});

/* -------- Boutons -------- */
function undo(){ strokes.pop(); redraw(); clearFeedback(); setOut(''); }
function clearPad(){
  strokes = []; redraw(); clearFeedback(); setOut('');
  if (quiz.checked) setRevealed(false);
}
$('undo').onclick = undo;
$('clear').onclick = clearPad;
$('eval').onclick = evaluate;

function setOut(html){ $('out').innerHTML = html; }
function clearFeedback(){ fbx.clearRect(0, 0, SIZE, SIZE); }

/* -------- Évaluation --------
   On compare des lignes médianes, pas des surfaces : le squelette du glyphe
   contre le tracé rendu en trait fin. Ni la graisse de la police ni
   l'épaisseur du pinceau n'influent donc sur le score.
   Précision : part du tracé à moins de TOL du squelette.
   Rappel    : part du squelette à moins de TOL du tracé.
   Score     : moyenne harmonique (F1), toujours entre 0 et 100 %. */
function rasterize(width, pose){
  const c = document.createElement('canvas'); c.width = c.height = N;
  const x = c.getContext('2d');
  x.fillStyle = '#fff'; x.fillRect(0, 0, N, N);
  const map = pose
    ? p => [pose.cx + pose.s * (p[0] - pose.cx) + pose.dx, pose.cy + pose.s * (p[1] - pose.cy) + pose.dy]
    : p => p;
  strokes.forEach(s=>drawStroke(x, {w: width ?? s.w, pts: s.pts.map(map)}, N));
  return toMask(x.getImageData(0, 0, N, N).data);
}
/* Mode Words : l'étudiant trace sans modèle, donc un peu trop haut, trop bas
   ou trop grand. On essaie quelques décalages (±6 % du cadre) et échelles
   (±15 %) et on garde le meilleur score, pour la cible comme pour les autres
   symboles. Les différences de taille nettes (ɪ/l, ˈ/l) restent pénalisées. */
function poseLines(){
  const pts = strokes.flatMap(s => s.pts);
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const cx = (Math.min(...xs) + Math.max(...xs)) / 2, cy = (Math.min(...ys) + Math.max(...ys)) / 2;
  const out = [];
  for (const s of [0.87, 1, 1.15]) for (const dx of [-.06, 0, .06]) for (const dy of [-.06, 0, .06]){
    const line = rasterize(1.5 / N, {s, dx, dy, cx, cy});
    out.push({ line, dl: distTo(line) });
  }
  return out;
}
function bestScore(m, poses){
  let best = null;
  for (const u of poses){ const s = score(m, u); if (!best || s.f1 > best.f1) best = s; }
  return best;
}
function userLines(){
  const line = rasterize(1.5 / N);     // ligne médiane du tracé
  return { line, ink: rasterize(), dl: distTo(line),
           uhw: Math.max(...strokes.map(s => s.w)) * N / 2 };
}
function score(m, u){
  let uN = 0, uIn = 0, mN = 0, mHit = 0;
  for (let i = 0; i < u.line.length; i++){
    if (u.line[i]){ uN++; if (m.dSkel[i] <= TOL) uIn++; }
    if (m.skel[i]){ mN++; if (u.dl[i] <= TOL) mHit++; }
  }
  const P = uN ? uIn / uN : 0, R = mN ? mHit / mN : 0;
  return { P, R, f1: (P + R) ? 2*P*R / (P + R) : 0 };
}
// rouge : partie du glyphe non couverte ; orange : encre hors du glyphe
function drawOverlay(m, u){
  const c = document.createElement('canvas'); c.width = c.height = N;
  const x = c.getContext('2d');
  const img = x.createImageData(N, N), px = img.data;
  for (let i = 0; i < u.line.length; i++){
    if (m.mask[i] && u.dl[i] > m.hw + TOL){ px[i*4] = 239; px[i*4+1] = 68; px[i*4+2] = 68; px[i*4+3] = 150; }
    else if (u.ink[i] && m.dSkel[i] > TOL + u.uhw){ px[i*4] = 245; px[i*4+1] = 158; px[i*4+2] = 11; px[i*4+3] = 170; }
  }
  x.putImageData(img, 0, 0);
  clearFeedback();
  fbx.imageSmoothingEnabled = true;
  fbx.drawImage(c, 0, 0, SIZE, SIZE);
}
function verdict(s){
  const text = s.f1 >= .85 ? 'Great!' : s.f1 >= .65 ? 'Getting there!' : 'Keep trying!';
  let hint = '';
  if (s.R < .9 && s.R < s.P - .05) hint = '<span class="hint">Some parts are <span class="miss">missing</span>.</span>';
  else if (s.P < .9 && s.P < s.R - .05) hint = '<span class="hint">Some ink is <span class="over">outside</span> the shape.</span>';
  return { text, hint };
}
function evaluate(){
  if (MODE === 'words') return evalWord();
  if (!model){ setOut('Loading…'); return; }
  if (!strokes.length){ setOut('<span class="hint">Draw the symbol first.</span>'); return; }
  const u = userLines(), s = score(model, u);
  drawOverlay(model, u);
  const v = verdict(s);
  setOut(`${Math.round(s.f1*100)}% · ${v.text}${v.hint}`);
  setRevealed(true);
}

/* -------- Mode -------- */
let MODE = store.get('ipa_mode', 'symbols') === 'words' ? 'words' : 'symbols';
document.querySelectorAll('.tabs button').forEach(b=>{
  b.onclick = ()=>setMode(b.dataset.mode);
});
function setMode(m){
  MODE = m;
  store.set('ipa_mode', m);
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected', b.dataset.mode === m));
  $('grid').hidden = m !== 'symbols';
  $('targetCard').hidden = m !== 'symbols';
  $('wordCard').hidden = m !== 'words';
  $('eval').textContent = 'Check';
  syncGhost();   // le fantôme du mode Symbols ne doit pas rester en mode Words
  applySize(true);
  if (m === 'words') startWords();
  else select(idx >= 0 ? idx : 0);
}

/* -------- Exercices sur des mots --------
   Une case par caractère de la transcription ; chaque case est notée avec
   le même score que les symboles isolés. Le symbole attendu n'apparaît
   qu'après vérification. */
let words = [], order = [], wpos = -1, W = null;
function shuffle(a){
  for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
const bySym = ch => symbols.find(s => s.ch === ch);

async function startWords(){
  if (!words.length){
    const j = await (await fetch('words.json?v=' + VERSION)).json();
    words = (j.words || []).filter(w => [...w.ipa].every(bySym));
    order = shuffle(words.map((_, i) => i));
  }
  if (W) setSlot(W.i); else nextWord();
}
function nextWord(){
  wpos = (wpos + 1) % order.length;
  if (wpos === 0 && W) shuffle(order);
  const w = words[order[wpos]];
  W = { ...w, chars: [...w.ipa], i: 0, scores: [], wrong: [], checked: false, done: false };
  setSlot(0);
}
async function setSlot(i){
  W.i = i; W.checked = false;
  current = bySym(W.chars[i]);
  strokes = []; redraw(); clearFeedback(); setOut('');
  renderWord();
  const token = ++modelToken;
  const m = await getModel(current);
  if (token === modelToken) model = m;
}
function renderWord(){
  $('wordText').textContent = W.word;
  $('wordListen').hidden = !W.audio;
  const box = $('slots'); box.innerHTML = '';
  W.chars.forEach((ch, k)=>{
    const s = document.createElement('div');
    const f = W.scores[k];
    s.className = 'slot' + (k === W.i && !W.done ? ' current' : '') +
      (f === undefined ? '' : W.wrong[k] || f < .65 ? ' bad' : f >= .85 ? ' good' : ' mid');
    const b = document.createElement('div'); b.className = 'box';
    if (f !== undefined){ const img = document.createElement('img'); img.alt = ch; img.src = pathFor(bySym(ch)); b.appendChild(img); }
    const p = document.createElement('div'); p.className = 'pct';
    p.textContent = f === undefined ? '' : W.wrong[k] ? '✗' : Math.round(f * 100) + '%';
    s.append(b, p); box.appendChild(s);
  });
  $('eval').textContent = W.done ? 'Next word' : W.checked ? (W.i < W.chars.length - 1 ? 'Next ›' : 'Finish') : 'Check';
}
async function evalWord(){
  if (!W) return;
  if (W.done){ nextWord(); return; }
  if (W.checked){
    if (W.i < W.chars.length - 1) setSlot(W.i + 1);
    else {
      W.done = true;
      const avg = W.scores.reduce((a, b)=>a + b, 0) / W.scores.length;
      strokes = []; redraw(); clearFeedback();
      setOut(`/${W.ipa}/ · ${Math.round(avg*100)}%`);
      renderWord();
    }
    return;
  }
  if (!model){ setOut('Loading…'); return; }
  if (!strokes.length){ setOut('<span class="hint">Draw the next symbol of the transcription.</span>'); return; }
  W.checked = true;
  const u = userLines(), poses = poseLines();
  const s = bestScore(model, poses);
  drawOverlay(model, u);
  W.scores[W.i] = s.f1;
  renderWord();
  const v = verdict(s);
  setOut(`${Math.round(s.f1*100)}% · ${v.text}${v.hint}`);
  const alt = await lookalike(poses, current, s);
  if (alt){
    W.wrong[W.i] = true; renderWord();
    setOut(`${Math.round(s.f1*100)}% · That looks like <b>${alt.ch}</b>, expected <b>${current.ch}</b>.`);
  }
}
/* Le tracé ressemble-t-il nettement à un autre symbole ? On ne le dit que si
   l'autre symbole est bien reconnu en valeur absolue et l'emporte d'au moins
   15 points : un gribouillis ne « ressemble » à rien. Réglage testé sur des
   tracés simulés : aucune fausse alerte sur des tracés corrects décalés. */
const LOOK = { min: .75, margin: .15 };
async function lookalike(poses, target, s){
  const all = await Promise.all(symbols.map(getModel));
  let best = null;
  all.forEach((m, k)=>{
    if (!m || symbols[k].ch === target.ch) return;
    const f = bestScore(m, poses).f1;
    if (!best || f > best.f) best = { f, ch: symbols[k].ch };
  });
  return best && best.f >= LOOK.min && best.f >= s.f1 + LOOK.margin ? best : null;
}
$('wordListen').onclick = ()=>{
  if (!W?.audio) return;
  if (player) player.pause();
  player = new Audio(audioURL(W.audio));
  player.play().catch(()=>{});
};
$('wordNext').onclick = ()=>nextWord();

/* -------- Clavier -------- */
document.addEventListener('keydown', e=>{
  if (e.target.closest('select,input')) return;
  if ((e.ctrlKey || e.metaKey) && e.key === 'z'){ e.preventDefault(); undo(); }
  else if (e.key === 'ArrowRight') MODE === 'words' ? nextWord() : step(1);
  else if (e.key === 'ArrowLeft' && MODE === 'symbols') step(-1);
  else if (e.key === 'Enter' && !e.target.closest('button')) evaluate();
});

/* -------- Démarrage -------- */
(async ()=>{
  await loadSymbols();
  buildGrid();
  await loadMetrics();
  const last = symbols.findIndex(s => s.ch === store.get('ipa_last', ''));
  idx = last >= 0 ? last : 0;
  setMode(MODE);
})();
</script>
